<body>
<a class="skip" href="#contenido" data-t="saltar"></a>

<header class="header">
  <div class="wrap nav">
    <a class="brand" href="#inicio" aria-label="Inicio">
      <span class="sun" aria-hidden="true">&#10035;</span>
      <span data-text="negocio.nombre"></span><span class="brand-dot">.</span>
    </a>
    <nav aria-label="Principal" id="navigation">
      <a href="#soluciones" data-t="navSoluciones"></a>
      <a href="#proceso" data-t="navProceso"></a>
      <a href="#preguntas" data-t="navPreguntas"></a>
    </nav>
    <a class="button nav-cta" href="#cotizar"><span data-t="navBoton"></span> <span aria-hidden="true">&#8599;</span></a>
    <button class="menu" aria-label="Abrir men&uacute;" aria-expanded="false" aria-controls="navigation">&#9776;</button>
  </div>
</header>

<main id="contenido">

  <!-- ============ PORTADA ============ -->
  <section class="hero" id="inicio">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow" data-text="portada.etiqueta"></p>
        <h1 data-text="portada.titulo"></h1>
        <p class="hero-description" data-text="portada.descripcion"></p>
        <a class="button primary" href="#cotizar"><span data-text="portada.boton"></span><span aria-hidden="true">&#8599;</span></a>
        <p class="hero-note" data-text="portada.nota"></p>
      </div>
      <div class="hero-visual">
        <img id="heroImage" width="1200" height="1000" alt="" fetchpriority="high">
        <div class="photo-top">
          <span class="photo-pill" data-t="pildoraFoto"></span>
          <span class="circle-sun" aria-hidden="true">&#10035;</span>
        </div>
        <div class="photo-caption"><span data-text="portada.pieFoto"></span><span aria-hidden="true">&#8599;</span></div>
      </div>
    </div>
    <div class="wrap hero-bottom">
      <span data-t="piePortada1"></span>
      <span data-t="piePortada2"></span>
    </div>
  </section>

  <!-- ============ POR QUE SOLAR ============ -->
  <section class="benefits section">
    <div class="wrap">
      <div class="section-heading">
        <div>
          <p class="eyebrow dark-label" data-t="ojoBeneficios"></p>
          <h2 data-text="textos.tituloBeneficios"></h2>
        </div>
        <p data-text="textos.textoBeneficios"></p>
      </div>
      <div class="benefit-grid" id="benefits"></div>
    </div>
  </section>

  <!-- ============ SERVICIOS ============ -->
  <section class="solutions section" id="soluciones">
    <div class="wrap">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-t="ojoServicios"></p>
          <h2 data-text="textos.tituloServicios"></h2>
        </div>
        <p data-text="textos.textoServicios"></p>
      </div>
      <div class="service-grid" id="services"></div>
      <p class="small-disclaimer" data-t="notaServicios"></p>
    </div>
  </section>

  <!-- ============ COMO FUNCIONA ============ -->
  <section class="process section" id="proceso">
    <div class="wrap process-grid">
      <div>
        <p class="eyebrow dark-label" data-t="ojoProceso"></p>
        <h2 data-text="textos.tituloProceso"></h2>
        <p class="process-intro" data-t="notaProceso"></p>
        <a class="text-link" href="#cotizar"><span data-t="enlaceProceso"></span> <span aria-hidden="true">&#8599;</span></a>
      </div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <!-- ============ PREGUNTAS ============ -->
  <section class="faq section" id="preguntas">
    <div class="wrap faq-grid">
      <div>
        <p class="eyebrow dark-label" data-t="ojoFaq"></p>
        <h2 data-text="textos.tituloFaq"></h2>
        <p data-t="notaFaq"></p>
      </div>
      <div id="faqs"></div>
    </div>
  </section>

  <!-- ============ FORMULARIO ============ -->
  <section class="contact section" id="cotizar">
    <div class="wrap contact-grid">
      <div>
        <p class="eyebrow" data-t="ojoContacto"></p>
        <h2 data-text="textos.tituloContacto"></h2>
        <p class="contact-intro" data-text="textos.textoContacto"></p>
        <div class="contact-location">
          <span aria-hidden="true">&#8982;</span>
          <div>
            <span class="mini-label" data-t="etiquetaZona"></span>
            <p data-text="negocio.zona"></p>
          </div>
        </div>
        <a class="phone-link" id="phoneLink" hidden></a>
      </div>

      <form id="quoteForm">
        <h3 data-text="formulario.titulo"></h3>
        <p class="form-intro" data-text="formulario.texto"></p>
        <div class="form-row">
          <label><span data-t="campoNombre"></span><input name="name" autocomplete="given-name" data-ph="campoNombreEj" required maxlength="80"></label>
          <label><span data-t="campoTelefono"></span><input name="phone" type="tel" autocomplete="tel" data-ph="campoTelefonoEj" required maxlength="30"></label>
        </div>
        <label><span data-t="campoCiudad"></span><input name="city" autocomplete="address-level2" data-ph="campoCiudadEj" required maxlength="100"></label>
        <label><span data-t="campoInteres"></span><select name="interest"></select></label>
        <label><span data-t="campoFactura"></span> <span class="optional" data-t="opcional"></span><select name="bill"></select></label>
        <label class="consent">
          <input type="checkbox" required>
          <span><span data-t="consiento"></span> <button type="button" class="privacy-trigger" data-t="verPrivacidad"></button></span>
        </label>
        <button class="button primary submit" type="submit"><span data-t="enviar"></span> <span aria-hidden="true">&#8599;</span></button>
        <p class="form-note" data-text="formulario.nota"></p>
        <p id="formStatus" role="status"></p>
      </form>
    </div>
  </section>

</main>

<footer>
  <div class="wrap footer-main">
    <div>
      <a class="brand" href="#inicio">
        <span class="sun" aria-hidden="true">&#10035;</span>
        <span data-text="negocio.nombre"></span><span class="brand-dot">.</span>
      </a>
      <p data-text="negocio.notaPie"></p>
    </div>
    <a href="#inicio" class="back-top" data-t="volverArriba"></a>
  </div>
  <div class="wrap footer-bottom">
    <span>&copy; <span id="year"></span> <span data-text="negocio.nombre"></span>. <span data-t="derechos"></span></span>
    <button class="privacy-trigger" data-t="privacidad"></button>
  </div>
</footer>

<dialog id="privacyDialog">
  <button id="closePrivacy" aria-label="Cerrar privacidad">&times;</button>
  <h2 data-t="privacidad"></h2>
  <p data-text="formulario.privacidad"></p>
  <p data-t="privacidadFin"></p>
</dialog>

<noscript><p class="noscript">Activa JavaScript para ver el contenido y utilizar el formulario de esta p&aacute;gina.</p></noscript>

<script>

"use strict";

          '<li><b>Las comillas cambiaron de forma.</b> Tienen que ser rectas ("así"), '+
              'no curvas (&#8220;así&#8221;). Pasa mucho al editar con TextEdit en Mac o con Word.</li>'+
          '<li><b>Falta una coma</b> entre dos datos.</li>'+
          '<li><b>Falta una llave</b> { o } al cerrar un bloque.</li>'+
          '<li><b>Se borró un trozo de más</b> sin querer.</li>'+
        '</ol>'+
        '<p style="font-size:16px;line-height:1.65;color:#5a4340;margin:0">'+
          'Lo más rápido: vuelve a abrir <b>EDITOR.html</b> y dale otra vez a '+
          '«Descargar mi web lista». Si quieres ver el error exacto, aprieta '+
          '<b>F12</b> y mira la pestaña Console.</p>'+
      '</div></div>';
}
if(typeof CONFIG === "undefined" || typeof T === "undefined"){ avisoConfigRoto(); return; }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Los tres dibujitos de las tarjetas. Van rotando. */
const DIBUJOS = [
  '<path d="M3 11 12 3l9 8v10H3Z"/><path d="M9 21v-7h6v7M3 11h18"/>',
  '<circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/>',
  '<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2m-2 4-4 6h5l-3 5"/>'
];
const dibujo = n => '<svg viewBox="0 0 24 24" aria-hidden="true">' + DIBUJOS[n % 3] + '</svg>';

/* ================================================================
   PINTAR LA PÁGINA
   Está metido en una función para poder repetirlo: así la vista
   previa del editor puede refrescar sin recargar nada.
   ================================================================ */
function pintar(){
const N = CONFIG.negocio, P = CONFIG.portada, TX = CONFIG.textos, F = CONFIG.formulario, S = CONFIG.estilo || {};

/* ---------- Los colores ---------- */
if(/^#[0-9a-f]{6}$/i.test(S.acento)) document.documentElement.style.setProperty("--accent", S.acento);
if(/^#[0-9a-f]{6}$/i.test(S.oscuro)){
  document.documentElement.style.setProperty("--dark", S.oscuro);
  document.documentElement.style.setProperty("--ink", S.oscuro);
}

/* ---------- El logo va primero ----------
   Si lo dejamos para después, al devolver la marca de siempre
   borraríamos el nombre que acabamos de escribir. */
document.querySelectorAll(".brand").forEach(marca => {
  if(!marca.dataset.original) marca.dataset.original = marca.innerHTML;
  if(N.logo){
    const img = document.createElement("img");
    img.src = N.logo; img.alt = N.nombre; img.className = "logo-img";
    marca.replaceChildren(img);
  }else if(marca.querySelector("img")){
    marca.innerHTML = marca.dataset.original;
  }
});

/* ---------- Los textos ---------- */
const leer = ruta => ruta.split(".").reduce((o,k)=> (o==null?o:o[k]), CONFIG);
document.querySelectorAll("[data-text]").forEach(e => { e.textContent = leer(e.dataset.text) || ""; });
document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T[e.dataset.t] || ""; });
document.querySelectorAll("[data-ph]").forEach(e => { e.placeholder = T[e.dataset.ph] || ""; });

document.title = N.nombre + " — " + N.categoria;
$('meta[name="description"]').content = P.descripcion || "";

/* ---------- La foto de portada ---------- */
const foto = document.getElementById("heroImage");
if(P.fotoHero){ foto.src = P.fotoHero; foto.alt = P.altHero || ""; }
foto.hidden = !P.fotoHero;

/* ---------- Por qué solar ---------- */
document.getElementById("benefits").innerHTML = CONFIG.beneficios.map((x,i) =>
  '<article class="benefit-card"><div class="benefit-icon">' + dibujo(i) + '</div>' +
  '<h3>' + esc(x.titulo) + '</h3><p>' + esc(x.texto) + '</p></article>').join("");

/* ---------- Los servicios ---------- */
document.getElementById("services").innerHTML = CONFIG.servicios.map((x,i) =>
  '<article class="service-card"><div class="service-top"><p>' + esc(x.etiqueta) + '</p>' +
  '<span class="service-icon">' + dibujo([1,2,0][i % 3]) + '</span></div>' +
  '<h3>' + esc(x.titulo) + '</h3>' +
  '<p class="service-description">' + esc(x.texto) + '</p>' +
  '<ul>' + (x.incluye || []).map(f => '<li>' + esc(f) + '</li>').join("") + '</ul>' +
  '<a href="#cotizar" data-servicio="' + i + '">' + esc(T.consultarEsta) + ' <span aria-hidden="true">↗</span></a></article>').join("");

/* La lista del formulario sale de los servicios: si el comprador
   cambia un servicio, la lista cambia sola y nunca se descuadran. */
const interes = $('[name="interest"]');
interes.innerHTML = CONFIG.servicios.map(x => '<option>' + esc(x.titulo) + '</option>').join("") +
                    '<option>' + esc(F.interesOtro) + '</option>';
document.querySelectorAll("[data-servicio]").forEach(a => a.addEventListener("click", ()=>{
  const s = CONFIG.servicios[Number(a.dataset.servicio)];
  if(s) interes.value = s.titulo;
}));

/* Los rangos de la factura también salen del config, por si el
   negocio no cobra en dólares. */
const factura = $('[name="bill"]');
factura.innerHTML = '<option value="' + esc(T.sinIndicar) + '">' + esc(T.eligeRango) + '</option>' +
                    (F.rangos || []).map(r => '<option>' + esc(r) + '</option>').join("");

/* ---------- Los pasos ---------- */
document.getElementById("steps").innerHTML = CONFIG.pasos.map((x,i) =>
  '<article class="step"><span class="step-number">0' + (i+1) + '</span>' +
  '<div><h3>' + esc(x.titulo) + '</h3><p>' + esc(x.texto) + '</p></div></article>').join("");

/* ---------- Las preguntas ---------- */
document.getElementById("faqs").innerHTML = CONFIG.faq.map(x =>
  '<details><summary>' + esc(x.p) + '</summary><p>' + esc(x.r) + '</p></details>').join("");

/* ---------- El teléfono ---------- */
const tel = String(N.whatsapp || "").replace(/\D/g, "");
const enlaceTel = document.getElementById("phoneLink");
enlaceTel.hidden = !tel;
if(tel){ enlaceTel.href = "tel:+" + tel; enlaceTel.textContent = T.llamanos + " +" + tel; }

document.getElementById("year").textContent = new Date().getFullYear();

/* Las secciones que se queden sin nada se esconden, junto con su
   enlace del menú, para no dejar un hueco vacío. */
esconder("soluciones", 'nav a[href="#soluciones"]', !CONFIG.servicios.length);
esconder("proceso",    'nav a[href="#proceso"]',    !CONFIG.pasos.length);
esconder("preguntas",  'nav a[href="#preguntas"]',  !CONFIG.faq.length);
}   /* ---- fin de pintar() ---- */

function esconder(idSeccion, selEnlace, vacia){
  const sec = document.getElementById(idSeccion);
  if(sec) sec.hidden = vacia;
  const enlace = $(selEnlace);
  if(enlace) enlace.hidden = vacia;
}

pintar();

/* ---------- El menú de móvil ---------- */
const boton = $(".menu"), menu = document.getElementById("navigation");
boton.addEventListener("click", ()=>{
  const abierto = boton.getAttribute("aria-expanded") !== "true";
  boton.setAttribute("aria-expanded", abierto);
  boton.setAttribute("aria-label", abierto ? T.cerrarMenu : T.abrirMenu);
  menu.classList.toggle("open", abierto);
  boton.textContent = abierto ? "×" : "☰";
});
menu.querySelectorAll("a").forEach(a => a.addEventListener("click", ()=>{
  menu.classList.remove("open");
  boton.setAttribute("aria-expanded", "false");
  boton.setAttribute("aria-label", T.abrirMenu);
  boton.textContent = "☰";
}));

/* ---------- La ventana de privacidad ---------- */
const ventana = document.getElementById("privacyDialog");
document.querySelectorAll(".privacy-trigger").forEach(b => b.addEventListener("click", ()=> ventana.showModal()));
document.getElementById("closePrivacy").addEventListener("click", ()=> ventana.close());
ventana.addEventListener("click", e=>{
  if(e.target !== ventana) return;
  const r = ventana.getBoundingClientRect();
  if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) ventana.close();
});

/* ---------- El formulario ---------- */
document.getElementById("quoteForm").addEventListener("submit", e=>{
  e.preventDefault();
  const aviso = document.getElementById("formStatus");
  const tel = String(CONFIG.negocio.whatsapp).replace(/\D/g, "");
  if(!/^\d{8,15}$/.test(tel)){ aviso.textContent = T.sinWhatsapp; return; }
  const f = new FormData(e.currentTarget);
  const texto = CONFIG.negocio.mensaje + "\n\n" +
    T.lineaNombre   + ": " + f.get("name")  + "\n" +
    T.lineaTelefono + ": " + f.get("phone") + "\n" +
    T.lineaCiudad   + ": " + f.get("city")  + "\n" +
    T.lineaInteres  + ": " + f.get("interest") + "\n" +
    T.lineaFactura  + ": " + f.get("bill");
  window.location.href = "https://wa.me/" + tel + "?text=" + encodeURIComponent(texto);
});

/* ================================================================
   VISTA PREVIA EN VIVO
   Cuando el editor abre esta página, le vamos mandando los cambios
   y aquí se repintan al momento. Solo funciona abierta desde el
   editor y en local: en la web publicada esto no se enciende.
   ================================================================ */
(function(){
  const enPruebas = location.protocol === "file:" ||
                    /(^|\.)netlify\.app$|localhost|127\.0\.0\.1/.test(location.hostname);
  if(!enPruebas || !window.opener) return;
  window.addEventListener("message", e=>{
    const d = e.data;
    if(!d || d.gws !== "config" || !d.datos) return;
    try{
      Object.keys(CONFIG).forEach(k => { delete CONFIG[k]; });
      Object.keys(d.datos).forEach(k => { CONFIG[k] = d.datos[k]; });
      pintar();
    }catch(err){ console.warn("vista previa:", err); }
  });
  try{ window.opener.postMessage({gws:"listo"}, "*"); }catch(e){}
})();
})();

</script>
</body>
</html>
