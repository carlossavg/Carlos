<body>
<a class="skip" href="#main" data-t="saltar"></a>

<div class="topbar">
  <div class="wrap">
    <span data-text="negocio.zona"></span>
    <span data-t="fraseArriba"></span>
  </div>
</div>

<header class="wrap header">
  <a class="brand" href="#" aria-label="Inicio">
    <span class="brand-icon" aria-hidden="true">&#8779;</span>
    <span><b data-text="negocio.nombre"></b><small data-text="negocio.categoria"></small></span>
  </a>
  <nav aria-label="Navegacion principal">
    <a href="#services" data-t="navServicios"></a>
    <a href="#approach" data-t="navPorque"></a>
    <a href="#questions" data-t="navPreguntas"></a>
  </nav>
  <a href="#contact" class="button small dark"><span data-t="navBoton"></span> <span>&#8599;</span></a>
</header>

<main id="main">

  <!-- ============ PORTADA ============ -->
  <section class="hero wrap">
    <div class="hero-copy">
      <span class="eyebrow"><i></i> <span data-text="portada.etiqueta"></span></span>
      <h1 id="headline" data-saltos="portada.titulo"></h1>
      <p id="description" data-text="portada.descripcion"></p>
      <div class="actions">
        <a class="button orange" href="#contact"><span data-text="portada.boton"></span> <span>&#8599;</span></a>
        <a class="textlink call-link" href="#contact"><span aria-hidden="true">&#9742;</span> <span data-etiqueta-llamar></span></a>
      </div>
      <div class="hero-notes">
        <span>&#10003; <span data-text="portada.nota1"></span></span>
        <span>&#10003; <span data-text="portada.nota2"></span></span>
      </div>
    </div>
    <div class="hero-visual">
      <img id="hero-image" alt="" fetchpriority="high">
      <div class="photo-label">
        <span class="label-icon">&#10003;</span>
        <span data-saltos="portada.etiquetaFoto"></span>
      </div>
      <span class="vertical-label" data-text="portada.etiquetaVertical"></span>
    </div>
  </section>

  <!-- ============ LA FRANJA ============ -->
  <div class="service-strip"><div class="wrap"></div></div>

  <!-- ============ SERVICIOS ============ -->
  <section class="wrap section" id="services">
    <div class="section-head">
      <div>
        <span class="eyebrow" data-t="ojoServicios"></span>
        <h2 data-saltos="textos.tituloServicios"></h2>
      </div>
      <p data-text="textos.textoServicios"></p>
    </div>
    <div class="services" id="service-grid"></div>
  </section>

  <!-- ============ POR QUE NOSOTROS ============ -->
  <section class="approach-section" id="approach">
    <div class="wrap approach">
      <div class="statement">
        <span class="eyebrow" data-t="ojoPrincipios"></span>
        <h2 data-saltos="textos.tituloPrincipios"></h2>
        <a href="#contact" class="button orange"><span data-text="textos.botonPrincipios"></span> <span>&#8599;</span></a>
      </div>
      <div class="principles"></div>
    </div>
  </section>

  <!-- ============ COMO FUNCIONA ============ -->
  <section class="wrap section process">
    <div>
      <span class="eyebrow" data-t="ojoPasos"></span>
      <h2 data-saltos="textos.tituloPasos"></h2>
    </div>
    <div class="steps"></div>
  </section>

  <!-- ============ FORMULARIO ============ -->
  <section class="contact-section" id="contact">
    <div class="wrap contact">
      <div>
        <span class="eyebrow" data-t="ojoContacto"></span>
        <h2 data-saltos="textos.tituloContacto"></h2>
        <p data-saltos="textos.textoContacto"></p>
        <a class="contact-call call-link" href="#request-form">&#9742; <span data-etiqueta-llamar></span></a>
        <div class="contact-meta">
          <span data-text="negocio.zona"></span>
          <span data-text="negocio.horario"></span>
        </div>
      </div>

      <form id="request-form">
        <h3 data-text="formulario.titulo"></h3>
        <p class="form-intro" data-text="formulario.texto"></p>
        <div class="form-row">
          <label><span data-t="campoNombre"></span><input name="name" autocomplete="name" data-ph="campoNombreEj" required maxlength="100"></label>
          <label><span data-t="campoTelefono"></span><input name="phone" type="tel" autocomplete="tel" data-ph="campoTelefonoEj" required maxlength="30"></label>
        </div>
        <label><span data-t="campoCorreo"></span> <span class="optional" data-t="opcional"></span><input name="email" type="email" autocomplete="email" data-ph="campoCorreoEj" maxlength="150"></label>
        <label><span data-t="campoServicio"></span><select name="service" required></select></label>
        <label><span data-t="campoMensaje"></span> <span class="optional" data-t="opcional"></span><textarea name="message" rows="3" data-ph="campoMensajeEj" maxlength="2000"></textarea></label>
        <button class="button orange" type="submit"><span data-t="enviar"></span> <span>&#8599;</span></button>
        <p class="form-note" data-text="formulario.nota"></p>
        <p id="form-status" role="status" tabindex="-1" hidden></p>
      </form>
    </div>
  </section>

  <!-- ============ PREGUNTAS ============ -->
  <section class="wrap section faq" id="questions">
    <div>
      <span class="eyebrow" data-t="ojoFaq"></span>
      <h2 data-saltos="textos.tituloFaq"></h2>
    </div>
    <div id="faq-list"></div>
  </section>

</main>

<footer>
  <div class="wrap footer-top">
    <a class="brand" href="#">
      <span class="brand-icon">&#8779;</span>
      <span><b data-text="negocio.nombre"></b><small data-text="negocio.categoria"></small></span>
    </a>
    <p data-saltos="negocio.frasePie"></p>
    <a href="#contact" class="textlink"><span data-t="hablemos"></span> &#8599;</a>
  </div>
  <div class="wrap footer-bottom">
    <span>&copy; <span id="year"></span> <span data-text="negocio.nombre"></span>. <span data-t="derechos"></span></span>
  </div>
</footer>

<div class="mobile-cta">
  <a class="call-link" href="#contact">&#9742; <span data-t="llamar"></span></a>
  <a href="#contact"><span data-t="pedirCorto"></span> &#8599;</a>
</div>

<script>
/* ================================================================
   AQUÍ NO HACE FALTA TOCAR NADA. Todo se cambia en config.js,
   y config.js se llena solo desde EDITOR.html.
   ================================================================ */
(() => {
"use strict";

/* ================================================================
   SI config.js ESTÁ ROTO, AVISAMOS EN PANTALLA
   Sin esto el comprador ve una página en blanco y no sabe por qué.
   ================================================================ */
function avisoConfigRoto(){
  document.body.innerHTML =
    '<div style="min-height:100vh;display:grid;place-items:center;padding:30px;'+
    'font-family:system-ui,sans-serif;background:#fff6f5;color:#2a1a18">'+
      '<div style="max-width:560px">'+
        '<p style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#b0453a;margin:0 0 14px">'+
          'El archivo config.js tiene un error</p>'+
        '<h1 style="font-size:28px;line-height:1.25;margin:0 0 18px;font-weight:600">'+
          'Se rompió algo al editar los datos</h1>'+
        '<p style="font-size:16px;line-height:1.65;color:#5a4340;margin:0 0 22px">'+
          'La página no puede cargar porque <b>config.js</b> quedó mal escrito. '+
          'Casi siempre es una de estas cuatro cosas:</p>'+
        '<ol style="font-size:15.5px;line-height:1.75;color:#5a4340;padding-left:20px;margin:0 0 24px">'+
          '<li><b>Las comillas cambiaron de forma.</b> Tienen que ser rectas ("así"), '+
              'no curvas (&#8220;así&#8221;). Pasa mucho al editar con TextEdit en Mac o con Word.</li>'+
          '<li><b>Falta una coma</b> entre dos datos.</li>'+
          '<li><b>Falta una llave</b> { o } al cerrar un bloque.</li>'+
          '<li><b>Se borró un trozo de más</b> sin querer.</li>'+
        '</ol>'+
        '<p style="font-size:16px;line-height:1.65;color:#5a4340;margin:0">'+
          'Lo más rápido: vuelve a abrir <b>EDITOR.html</b> y dale otra vez a '+
          '«Descargar mi web lista». Si quieres ver el error exacto, aprieta '+
          '<b>F12</b> y mira la pestaña Console.</p>'+
      '</div></div>';
}
if(typeof CONFIG === "undefined" || typeof T === "undefined"){ avisoConfigRoto(); return; }

const $ = s => document.querySelector(s);
const leer = ruta => ruta.split(".").reduce((o,k)=> (o==null?o:o[k]), CONFIG);

/* Los dibujitos de los servicios. El comprador escoge cuál con la
   palabra drop, drain, heat o tap. Si pone otra cosa, sale la gota. */
const DIBUJOS = {
  drop: "M24 4C20 12 10 21 10 29a14 14 0 0 0 28 0C38 21 28 12 24 4ZM17 29a7 7 0 0 0 7 7",
  drain:"M5 9h38M9 17h30M12 17v13a12 12 0 0 0 24 0V17M24 4v8M20 8l4 4 4-4M24 30v14",
  heat: "M13 10h22v33H13zM18 5v5M30 5v5M18 20h12M25 25l-5 7h7l-5 7",
  tap:  "M7 29v-8h27a7 7 0 0 1 7 7v5h-9v-4H7ZM18 21V10M12 10h13M18 5v5M36 38v5"
};
function icono(nombre){
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 48 48");
  svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.8"); svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round"); svg.setAttribute("aria-hidden", "true");
  svg.classList.add("service-icon");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", DIBUJOS[nombre] || DIBUJOS.drop);
  svg.append(p);
  return svg;
}

/* Los saltos de línea del config se respetan en los títulos */
function conSaltos(el, texto){
  el.replaceChildren();
  String(texto || "").split("\n").forEach((linea, i)=>{
    if(i) el.append(document.createElement("br"));
    el.append(document.createTextNode(linea));
  });
}

/* ================================================================
   PINTAR LA PÁGINA
   Está metido en una función para poder repetirlo: así la vista
   previa del editor puede refrescar sin recargar nada.
   ================================================================ */
function pintar(){
const N = CONFIG.negocio, P = CONFIG.portada, TX = CONFIG.textos, F = CONFIG.formulario, S = CONFIG.estilo || {};

/* ---------- El logo va primero ----------
   Si lo dejamos para después, al devolver la marca de siempre
   borraríamos el nombre que acabamos de escribir. */
document.querySelectorAll(".brand").forEach(marca => {
  if(!marca.dataset.original) marca.dataset.original = marca.innerHTML;

function esconder(idSeccion, selEnlace, vacia){
  const sec = document.getElementById(idSeccion);
  if(sec) sec.hidden = vacia;
  const enlace = $(selEnlace);
  if(enlace) enlace.hidden = vacia;
}

pintar();

/* ---------- El formulario ----------
   Manda a WhatsApp, igual que el resto de plantillas. Antes esta
   página solo decía "esto es una demostración" y no enviaba nada:
   el comprador la publicaba y no le llegaba ni un cliente. */
document.getElementById("request-form").addEventListener("submit", e=>{
  e.preventDefault();
  const aviso = document.getElementById("form-status");
  aviso.hidden = false;
  const tel = String(CONFIG.negocio.whatsapp).replace(/\D/g, "");
  if(!/^\d{8,15}$/.test(tel)){ aviso.textContent = T.sinWhatsapp; aviso.focus(); return; }
  aviso.textContent = "";
  aviso.hidden = true;
  const f = new FormData(e.currentTarget);
  const lineas = [
    CONFIG.negocio.mensaje, "",
    T.lineaNombre   + ": " + f.get("name"),
    T.lineaTelefono + ": " + f.get("phone")
  ];
  if(f.get("email"))   lineas.push(T.lineaCorreo + ": " + f.get("email"));
  lineas.push(T.lineaServicio + ": " + f.get("service"));
  if(f.get("message")) lineas.push(T.lineaMensaje + ": " + f.get("message"));
  window.location.href = "https://wa.me/" + tel + "?text=" + encodeURIComponent(lineas.join("\n"));
});

/* ================================================================
   VISTA PREVIA EN VIVO
   Cuando el editor abre esta página, le vamos mandando los cambios
   y aquí se repintan al momento. Solo funciona abierta desde el
   editor y en local: en la web publicada esto no se enciende.
   ================================================================ */
(function(){
  const enPruebas = location.protocol === "file:" ||
                    /(^|\.)netlify\.app$|localhost|127\.0\.0\.1/.test(location.hostname);
  if(!enPruebas || !window.opener) return;
  window.addEventListener("message", e=>{
    const d = e.data;
    if(!d || d.gws !== "config" || !d.datos) return;
    try{
      Object.keys(CONFIG).forEach(k => { delete CONFIG[k]; });
      Object.keys(d.datos).forEach(k => { CONFIG[k] = d.datos[k]; });
      pintar();
    }catch(err){ console.warn("vista previa:", err); }
  });
  try{ window.opener.postMessage({gws:"listo"}, "*"); }catch(e){}
})();
})();
